name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build app bundle
        run: ./Scripts/build-app.sh release

      - name: Zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Wagebeat.app Wagebeat.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wagebeat.app.zip
          path: build/Wagebeat.app.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Wagebeat.app.zip
          generate_release_notes: true
